<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0B1F35"
    >

    <meta
        name="description"
        content="Explore verified living spaces on Nivora."
    >

    <title>
        Explore | Nivora
    </title>


    <link
        rel="icon"
        type="image/svg+xml"
        href="../assets/icons/nivora-mark.svg"
    >


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >


    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >


    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Sora:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="../css/tokens.css"
    >


    <link
        rel="stylesheet"
        href="../css/style.css"
    >


    <link
        rel="stylesheet"
        href="../css/components.css"
    >


    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >

</head>


<body class="explore-page">


    <!-- ==================================================
         HEADER
    =================================================== -->

    <header class="explore-header">

        <div class="container explore-header-inner">


            <a
                href="dashboard.html"
                class="brand"
            >

                <img
                    src="../assets/icons/nivora-logo.svg"
                    alt="Nivora"
                >

            </a>


            <div class="explore-top-search">

                <span class="explore-search-icon">
                    ⌕
                </span>


                <input
                    id="exploreSearch"
                    type="search"
                    placeholder="Search PG, hostel, flat, room..."
                    autocomplete="off"
                >


                <button
                    id="exploreSearchButton"
                    type="button"
                    aria-label="Search"
                >
                    →
                </button>

            </div>


            <div class="explore-header-actions">

                <button
                    id="exploreLocation"
                    class="location-chip"
                    type="button"
                >
                    ⌖ Location
                </button>


                <a
                    href="profile.html"
                    class="dashboard-avatar"
                    id="exploreAvatar"
                >
                    U
                </a>

            </div>

        </div>

    </header>



    <!-- ==================================================
         MAIN
    =================================================== -->

    <main class="container explore-main">


        <!-- ==================================================
             INTRO
        =================================================== -->

        <section class="explore-intro">


            <div>

                <span class="section-eyebrow">
                    DISCOVER
                </span>


                <h1>
                    Find a place that
                    <span>fits you.</span>
                </h1>


                <p>
                    Explore verified places based on your
                    location, budget and preferences.
                </p>

            </div>


            <div class="explore-result-summary">

                <span id="resultCount">
                    0
                </span>


                <small>
                    places found
                </small>

            </div>

        </section>



        <!-- ==================================================
             SEARCH
        =================================================== -->

        <section class="explore-search-panel">


            <div class="search-field-large">

                <span>
                    ⌕
                </span>


                <input
                    id="mainSearch"
                    type="search"
                    placeholder="Try “PG near my college”"
                    autocomplete="off"
                >

            </div>


            <button
                id="useLocationButton"
                class="explore-action-button"
                type="button"
            >
                ⌖ Near me
            </button>


            <button
                id="filterToggle"
                class="explore-action-button"
                type="button"
            >
                ⚙ Filters
            </button>

        </section>



        <!-- ==================================================
             CATEGORY
        =================================================== -->

        <section class="explore-categories">

            <button
                class="category-tab active"
                data-category="all"
                type="button"
            >
                All
            </button>


            <button
                class="category-tab"
                data-category="hostel"
                type="button"
            >
                Hostels
            </button>


            <button
                class="category-tab"
                data-category="pg"
                type="button"
            >
                PG
            </button>


            <button
                class="category-tab"
                data-category="flat"
                type="button"
            >
                Rental Flats
            </button>


            <button
                class="category-tab"
                data-category="room"
                type="button"
            >
                Rooms
            </button>


            <button
                class="category-tab"
                data-category="mess"
                type="button"
            >
                Mess
            </button>


            <button
                class="category-tab"
                data-category="flatmate"
                type="button"
            >
                Flatmates
            </button>

        </section>



        <!-- ==================================================
             FILTER PANEL
        =================================================== -->

        <section
            id="filterPanel"
            class="filter-panel"
            hidden
        >


            <div class="filter-field">

                <label for="minBudget">
                    Minimum budget
                </label>


                <input
                    id="minBudget"
                    type="number"
                    min="0"
                    step="500"
                    placeholder="₹0"
                >

            </div>


            <div class="filter-field">

                <label for="maxBudget">
                    Maximum budget
                </label>


                <input
                    id="maxBudget"
                    type="number"
                    min="0"
                    step="500"
                    placeholder="₹20,000"
                >

            </div>


            <div class="filter-field">

                <label for="roomType">
                    Room type
                </label>


                <select id="roomType">

                    <option value="all">
                        Any room type
                    </option>

                    <option value="single">
                        Single
                    </option>

                    <option value="double">
                        Double
                    </option>

                    <option value="shared">
                        Shared
                    </option>

                </select>

            </div>


            <button
                id="clearFilters"
                class="clear-filter-button"
                type="button"
            >
                Clear
            </button>

        </section>



        <!-- ==================================================
             RESULT TOOLBAR
        =================================================== -->

        <section class="result-toolbar">


            <div>

                <strong>
                    Recommended for you
                </strong>


                <span id="activeSearchText">
                    Near your location
                </span>

            </div>


            <label class="sort-control">

                <span>
                    Sort
                </span>


                <select id="sortSelect">

                    <option value="relevance">
                        Relevance
                    </option>


                    <option value="price-low">
                        Price: low to high
                    </option>


                    <option value="price-high">
                        Price: high to low
                    </option>


                    <option value="rating">
                        Rating
                    </option>


                    <option value="distance">
                        Nearest first
                    </option>

                </select>

            </label>

        </section>



        <!-- ==================================================
             LISTINGS
        =================================================== -->

        <section
            id="listingGrid"
            class="explore-listing-grid"
        ></section>



        <!-- ==================================================
             EMPTY STATE
        =================================================== -->

        <section
            id="emptyState"
            class="explore-empty-state"
            hidden
        >

            <div class="empty-state-icon">
                ⌕
            </div>


            <h2>
                Nothing matched your search.
            </h2>


            <p>
                Try another category,
                budget or location.
            </p>


            <button
                id="emptyStateReset"
                class="btn btn-primary"
                type="button"
            >
                Reset search
            </button>

        </section>

    </main>



    <!-- ==================================================
         MOBILE NAVIGATION
    =================================================== -->

    <nav class="mobile-bottom-nav">


        <a
            href="dashboard.html"
            class="mobile-nav-item"
        >

            <span>
                ⌂
            </span>

            <small>
                Home
            </small>

        </a>


        <a
            href="explore.html"
            class="mobile-nav-item active"
        >

            <span>
                ⌕
            </span>

            <small>
                Explore
            </small>

        </a>


        <a
            href="flatmate.html"
            class="mobile-nav-item"
        >

            <span>
                ◎
            </span>

            <small>
                Connect
            </small>

        </a>


        <a
            href="support.html"
            class="mobile-nav-item"
        >

            <span>
                ♡
            </span>

            <small>
                Support
            </small>

        </a>


        <a
            href="profile.html"
            class="mobile-nav-item"
        >

            <span id="mobileExploreInitial">
                U
            </span>

            <small>
                Profile
            </small>

        </a>

    </nav>



    <!-- ==================================================
         JAVASCRIPT
    =================================================== -->

    <script src="../js/config.js"></script>

    <script src="../js/storage.js"></script>

    <script src="../js/explore.js"></script>


</body>

</html>
