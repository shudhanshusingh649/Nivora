<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OTP Verification | Nivora</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">

</head>

<body class="auth-body">


<div class="auth-shell">

    <section class="auth-brand-panel">

        <a href="../index.html" class="brand brand-light">
            <span class="brand-symbol">⌂</span>

            <span class="brand-copy">
                <strong>Nivora</strong>
                <small>Find. Verify. Live.</small>
            </span>
        </a>


        <div class="auth-brand-content">

            <span class="eyebrow-pill">
                🔐 SECURE ACCESS
            </span>

            <h1>
                Verify your
                <span>number.</span>
            </h1>

            <p>
                A verified account starts
                your personalized Nivora experience.
            </p>

        </div>

    </section>


    <section class="auth-content">

        <div class="auth-card">

            <span class="eyebrow">
                STEP 01
            </span>

            <h2>Verify OTP</h2>

            <p class="muted">
                Code sent to
                <strong id="phoneDisplay"></strong>
            </p>


            <form id="otpForm">

                <div class="otp-grid">

                    <input maxlength="1" inputmode="numeric">
                    <input maxlength="1" inputmode="numeric">
                    <input maxlength="1" inputmode="numeric">
                    <input maxlength="1" inputmode="numeric">
                    <input maxlength="1" inputmode="numeric">
                    <input maxlength="1" inputmode="numeric">

                </div>


                <button
                    type="submit"
                    class="btn btn-primary full"
                >
                    Verify & Proceed →
                </button>

            </form>


            <button
                class="text-btn"
                id="resendOtp"
            >
                Resend code
            </button>


            <div class="demo-code">
                Demo OTP:
                <strong>123456</strong>
            </div>

        </div>

    </section>

</div>


<script src="../js/otp.js"></script>

</body>
</html>
